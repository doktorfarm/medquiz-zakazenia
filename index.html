.table tbody tr:last-child :is(th, td) {

}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);

  background: var(--card);

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);

  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;

}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {

  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {

  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {

}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host's design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls &gt; button::before,
.viz-carousel-picker &gt; summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: &quot;&quot;;
  pointer-events: none;
}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(&gt; .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker &gt; summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;

    {t:'Definicje',s:105,q:'Co oznacza tenesmus recti?',o:[&quot;Silne, nieustające parcie na stolec, z bólem przy wypróżnieniu&quot;, &quot;Kurczowy ból brzucha bez parcia na stolec&quot;, &quot;Bezbolesna potrzeba oddania dużej objętości stolca&quot;, &quot;Bolesne parcie na mocz&quot;],a:0,e:'Tenesmus recti to uporczywe, bolesne parcie na stolec. W zespole czerwonkowym może towarzyszyć mu krew w stolcu.'},
    {t:'Epidemiologia',s:185,q:'Jaka jest przedstawiona w wykładzie zależność między niedożywieniem a chorobami biegunkowymi?',o:['Niedożywienie zwiększa podatność i ciężkość choroby, a biegunka pogłębia niedożywienie','Niedożywienie chroni przed ciężką biegunką','Biegunka poprawia stan odżywienia','Nie występuje między nimi żadna zależność'],a:0,e:'To zależność dwukierunkowa: niedożywienie sprzyja zakażeniom i cięższemu przebiegowi, a choroby biegunkowe dodatkowo pogarszają odżywienie.'},
    {t:'Zespoły kliniczne',s:385,q:'Który zestaw patogenów wymieniono przy wodnistej biegunce o nagłym początku?',o:['Norowirusy, adenowirusy i rotawirusy','Wyłącznie Salmonella Typhi i Paratyphi','Wyłącznie Shigella dysenteriae','Wyłącznie bakterie wywołujące zakażenia układu moczowego'],a:0,e:'Slajd wymienia noro-, adeno- i rotawirusy, ale również inne przyczyny, np. Bacillus cereus, Clostridium perfringens, Cryptosporidium oraz niektóre szczepy E. coli.'},
    {t:'Zespoły kliniczne',s:425,q:'Masywna wodnista biegunka ze skrajnym odwodnieniem sugeruje przede wszystkim który z wymienionych patogenów?',o:[&quot;Vibrio cholerae O1 lub O139&quot;, &quot;Salmonella Typhi&quot;, &quot;Shigella flexneri&quot;, &quot;Yersinia enterocolitica&quot;],a:0,e:'W tym zespole wykład wskazuje Vibrio cholerae O1 i O139 oraz enterotoksykogenne E. coli (ETEC). Największym zagrożeniem jest utrata płynów.'},
    {t:'Zespoły kliniczne',s:485,q:'Który obraz najlepiej odpowiada dyzenterii, czyli biegunce inwazyjnej?',o:['Krew i śluz w stolcu, gorączka, kurczowe bóle oraz bolesne parcie','Wyłącznie izolowane wymioty bez biegunki','Bezbolesna wodnista biegunka bez widocznej krwi jako jedyny objaw','Przedłużająca się gorączka bez jakichkolwiek objawów jelitowych'],a:0,e:'Dyzenteria wiąże się z lokalną inwazją jelita. Typowe są krew i śluz, gorączka, kurczowe bóle brzucha oraz bolesne parcie; w kale mogą być widoczne granulocyty.'},
    {t:'Zespoły kliniczne',s:505,q:'Biegunka trwa ponad 2 tygodnie. Który patogen wymieniono w wykładzie jako przyczynę biegunki uporczywej?',o:[&quot;Giardia lamblia&quot;, &quot;Salmonella Typhi&quot;, &quot;Staphylococcus aureus w zatruciu enterotoksyną&quot;, &quot;Vibrio cholerae O1&quot;],a:0,e:'Przy biegunce uporczywej wymieniono m.in. Giardia lamblia, Cryptosporidium, Cystoisospora i Cyclospora. Slajd zwraca również uwagę na możliwość niedoboru odporności.'},
    {t:'Zespoły kliniczne',s:545,q:'Nagłe wymioty wystąpiły 2 godziny po posiłku. Która przyczyna pasuje do podanego w wykładzie krótkiego okresu wylęgania 1–6 godzin?',o:[&quot;Toksyna gronkowcowa&quot;, &quot;Salmonella Typhi&quot;, &quot;Giardia lamblia&quot;, &quot;Yersinia enterocolitica&quot;],a:0,e:'Przy zatruciu toksyną gronkowcową podano okres wylęgania 1–6 godzin oraz objawy trwające około 12 godzin. Sam czas początku jest wskazówką, a nie pełnym rozpoznaniem.'},
    {t:'Zespoły kliniczne',s:605,q:'Co odróżnia opisany zespół durowy od zakażenia ograniczonego do jelita?',o:['Wtórny rozsiew ogólnoustrojowy i przedłużająca się gorączka','Zawsze wyłącznie wymioty trwające 1 godzinę','Brak możliwości zaparcia','Wyłącznie uszkodzenie skóry bez objawów ogólnych'],a:0,e:'Po początkowej inwazji jelita dochodzi do rozsiewu ogólnoustrojowego. Wykład wymienia przedłużającą się gorączkę, hepatosplenomegalię i objawy neuropsychiatryczne; możliwe są zarówno biegunka, jak i zaparcie.'},
    {t:'Wywiad i leczenie',s:685,q:'Która informacja z wywiadu jest szczególnie istotna przy podejrzeniu biegunki związanej z C. difficile?',o:[&quot;Niedawne przyjmowanie antybiotyków&quot;, &quot;Spożycie niedogotowanej wieprzowiny&quot;, &quot;Kontakt z domowymi gadami&quot;, &quot;Spożycie surowych jaj&quot;],a:0,e:'Wykład zaleca pytanie o przyjmowane leki, zwłaszcza antybiotyki. W części o CDI antybiotykoterapia jest przedstawiona jako istotny czynnik ryzyka.'},
    {t:'Wywiad i leczenie',s:805,q:'Pacjent z bólem brzucha i wymiotami ma objawy otrzewnowe. Jakie zagrożenie diagnostyczne podkreśla wykład?',o:['Błędne rozpoznanie zakażenia pokarmowego zamiast ostrego brzucha, np. perforacji','Założenie, że objawy otrzewnowe zawsze wykluczają poważną chorobę','Uznanie każdego takiego przypadku za rotawirozę','Pominięcie badania brzucha, jeśli występują wymioty'],a:0,e:'Slajd ostrzega przed błędną diagnozą. Niedrożność, perforacja, krwawienie, ciąża pozamaciczna, zapalenie opon czy sepsa mogą zostać błędnie uznane za zakażenie pokarmowe.'},
    {t:'Wywiad i leczenie',s:845,q:'Jakie podstawowe działania w leczeniu objawowym przedstawiono w wykładzie?',o:['Nawodnienie i wyrównanie zaburzeń elektrolitowych','Rutynowy antybiotyk u każdego chorego','Wyłącznie całkowite ograniczenie płynów','Wyłącznie leczenie chirurgiczne wszystkich biegunek'],a:0,e:'Wykład kładzie nacisk na nawodnienie oraz wyrównanie elektrolitów, zwłaszcza potasu. Leczenie przyczynowe jest omawiane jako zależne od sytuacji klinicznej.'},
    {t:'Dur brzuszny',s:1065,q:'Jaka zdolność pałeczek durowych sprzyja przedłużonej bakteriemii?',o:[&quot;Przetrwanie wewnątrz makrofagów&quot;, &quot;Namnażanie wyłącznie w świetle jelita bez inwazji&quot;, &quot;Wytwarzanie przetrwalników odpornych na alkohol&quot;, &quot;Działanie gotowej toksyny spożytej z posiłkiem&quot;],a:0,e:'Pałeczki durowe potrafią przetrwać i namnażać się wewnątrz makrofagów. Wykład łączy to z przedłużoną bakteriemią także u osób immunokompetentnych.'},
    {t:'Dur brzuszny',s:1105,q:'Jaki rezerwuar Salmonella Typhi wskazano w wykładzie?',o:[&quot;Ludzie&quot;, &quot;Drób i jaja&quot;, &quot;Gady i płazy&quot;, &quot;Świnie&quot;],a:0,e:'Rezerwuarem pałeczek duru brzusznego są ludzie. Zakażenie może nastąpić przez żywność lub wodę zanieczyszczoną kałem oraz kontakt z chorym, ozdrowieńcem lub nosicielem.'},
    {t:'Dur brzuszny',s:1165,q:'Które miejsce wskazano jako główne miejsce przetrwania zakażenia w nosicielstwie duru brzusznego?',o:[&quot;Pęcherzyk żółciowy&quot;, &quot;Węzły chłonne krezki jako jedyne miejsce nosicielstwa&quot;, &quot;Śledziona jako główne miejsce nosicielstwa&quot;, &quot;Żołądek&quot;],a:0,e:'Slajd wskazuje pęcherzyk żółciowy jako główne miejsce przetrwania zakażenia związanego z nosicielstwem.'},
    {t:'Dur brzuszny',s:1325,q:'Jakie badanie szczególnie podkreślono w rozpoznawaniu duru brzusznego?',o:[&quot;Posiew krwi, nie tylko kału&quot;, &quot;Wyłącznie posiew kału&quot;, &quot;Wyłącznie wykrycie leukocytów w kale&quot;, &quot;Wyłącznie test na toksyny A i B&quot;],a:0,e:'Wykład podkreśla posiew krwi, ponieważ zakażenie może mieć charakter ogólnoustrojowy z bakteriemią. Samo badanie kału nie wyczerpuje diagnostyki.'},
    {t:'Dur brzuszny',s:1285,q:'Który objaw wymieniono w obrazie klinicznym duru brzusznego?',o:[&quot;Tętno nieproporcjonalnie niskie w stosunku do gorączki&quot;, &quot;Stolce ryżowate jako charakterystyczny objaw&quot;, &quot;Izolowane wymioty w ciągu 1–6 godzin po posiłku&quot;, &quot;Biegunka poantybiotykowa jako objaw definiujący&quot;],a:0,e:'Na slajdzie wymieniono względnie niskie tętno w stosunku do gorączki, różyczkę durową, tkliwość brzucha i hepatosplenomegalię.'},
    {t:'Dur brzuszny',s:1305,q:'Które powikłanie gastroenterologiczne duru brzusznego omówiono?',o:[&quot;Krwawienie lub perforację przewodu pokarmowego&quot;, &quot;Wyłącznie przejściową utratę apetytu bez powikłań jelitowych&quot;, &quot;Tylko krótkotrwałe nudności po posiłku&quot;, &quot;Brak możliwości wystąpienia powikłań jelitowych&quot;],a:0,e:'Wykład wymienia krwawienie oraz perforację przewodu pokarmowego. Perforacja może powodować ból brzucha i objawy otrzewnowe.'},
    {t:'Salmonelloza niedurowa',s:1465,q:'Dlaczego samo umycie skorupki jaja nie usuwa całego ryzyka zakażenia Salmonella?',o:['Zawartość jaja może być skażona jeszcze przed wytworzeniem skorupki','Bakterie występują wyłącznie na skorupce','Skorupka zawsze sterylizuje wnętrze jaja','Salmonella nigdy nie jest związana z jajami'],a:0,e:'Według slajdu Salmonella może występować w jajnikach i jajowodach kur. Skażeniu mogą ulec żółtko i białko jeszcze przed powstaniem skorupki.'},
    {t:'Salmonelloza niedurowa',s:1605,q:'Dlaczego w wykładzie nie zaleca się rutynowej antybiotykoterapii niepowikłanej salmonellozy niedurowej?',o:['Nie skraca przebiegu choroby i zwiększa ryzyko CDI','Zawsze natychmiast usuwa wszystkie objawy, więc jest zbędna','Salmonella jest wirusem','Antybiotyki są zalecane obowiązkowo w każdym przypadku'],a:0,e:'Przedstawiono leczenie objawowe. Slajd podaje, że antybiotykoterapia nie skraca przebiegu choroby i zwiększa ryzyko zakażenia C. difficile; inne slajdy omawiają wyjątki związane z ryzykiem i ciężkością zakażenia.'},
    {t:'Shigella',s:1645,q:'Jaki rezerwuar Shigella przedstawiono w wykładzie?',o:[&quot;Ludzki&quot;, &quot;Głównie drób&quot;, &quot;Głównie świnie&quot;, &quot;Głównie domowe gady&quot;],a:0,e:'Shigella została przedstawiona jako patogen ludzki, łatwo przenoszony, szczególnie przy utrudnionym dostępie do czystej wody.'},
    {t:'Shigella',s:1705,q:'Jaka zmiana stolców może występować w przebiegu zakażenia Shigella?',o:['Początkowo obfite wodniste stolce, później częste małe porcje ze śluzem lub krwią i bolesnym parciem','Zawsze brak jakichkolwiek zmian stolca','Wyłącznie pojedyncze zaparcie bez bólu i gorączki','W każdym przypadku identyczne stolce przez cały przebieg'],a:0,e:'Wykład przedstawia przejście od gorączki, kurczowych bólów i obfitych wodnistych stolców do częstego oddawania małych ilości stolca ze śluzem lub krwią oraz bolesnym parciem.'},
    {t:'Cholera',s:1805,q:'Z którym zakażeniem wykład wiąże „stolce ryżowate”?',o:[&quot;Cholerą&quot;, &quot;Czerwonką bakteryjną&quot;, &quot;Durem brzusznym&quot;, &quot;Jersiniozą&quot;],a:0,e:'W ciężkiej cholerze treść staje się wodojasna, a następnie biaława, ze strzępkami błony śluzowej. To obraz określany jako stolce ryżowate.'},
    {t:'Cholera',s:1905,q:'Który zestaw objawów odpowiada skrajnemu odwodnieniu opisanemu w wykładzie?',o:[&quot;Zapadnięte gałki oczne, suche śluzówki, obniżone napięcie skóry i anuria&quot;, &quot;Gorączka, różyczka durowa i względnie niskie tętno&quot;, &quot;Krew i śluz w stolcu oraz bolesne parcie&quot;, &quot;Ból w prawym dole biodrowym i zapalenie węzłów krezki&quot;],a:0,e:'Slajd wymienia m.in. senność, zapadnięte gałki oczne, obniżone napięcie skóry, suche śluzówki i anurię, czyli brak wydalania moczu.'},
    {t:'Cholera',s:1925,q:'Jakie działanie wskazano w postępowaniu przy cholerze z ciężkim odwodnieniem?',o:['Nawadnianie dożylne','Całkowite wstrzymanie podaży płynów','Wyłącznie obserwację bez uzupełniania płynów','Leczenie wyłącznie probiotykiem'],a:0,e:'Wykład wskazuje nawadnianie dożylne; omawia również antybiotykoterapię oraz profilaktykę poprzez higienę komunalną i szczepienia.'},
    {t:'C. difficile',s:1965,q:'Który opis odpowiada C. difficile?',o:[&quot;Gram-dodatnia bakteria beztlenowa tworząca przetrwalniki i toksyny&quot;, &quot;Gram-ujemna pałeczka namnażająca się wewnątrz makrofagów&quot;, &quot;Wirus wywołujący zachorowania zbiorowe zimą&quot;, &quot;Pierwotniak kojarzony z biegunką uporczywą&quot;],a:0,e:'C. difficile jest Gram-dodatnią bakterią beztlenową tworzącą przetrwalniki. Toksyny A i B uczestniczą w wywoływaniu zapalenia okrężnicy i biegunki.'},
    {t:'C. difficile',s:1965,q:'Jaka cecha spor C. difficile utrudnia kontrolę transmisji?',o:[&quot;Odporność m.in. na wysuszenie i środki odkażające na bazie alkoholu&quot;, &quot;Duża wrażliwość na wszystkie środki alkoholowe&quot;, &quot;Zdolność przetrwania wyłącznie w środowisku beztlenowym&quot;, &quot;Brak odporności na wysuszenie&quot;],a:0,e:'Wykład podkreśla odporność spor na warunki środowiskowe, wysuszenie oraz środki na bazie alkoholu. Omawia również rękawiczki, izolację i dezynfekcję otoczenia.'},
    {t:'C. difficile',s:2065,q:'Jak antybiotykoterapia sprzyja rozwojowi CDI?',o:[&quot;Zaburza naturalną florę jelitową i oporność na kolonizację&quot;, &quot;Wzmacnia oporność jelita na kolonizację przez C. difficile&quot;, &quot;Powoduje zakażenie poprzez bezpośrednie dostarczenie spor&quot;, &quot;Wywołuje chorobę wyłącznie przez reakcję alergiczną&quot;],a:0,e:'Antybiotykoterapia zaburza naturalną florę jelitową oraz ochronę przed kolonizacją. Rozwój C. difficile i produkcja toksyn prowadzą do uszkodzenia nabłonka i zapalenia.'},
    {t:'C. difficile',s:2125,q:'W badaniu wykryto C. difficile lub jego toksyny, ale pacjent nie ma objawów. Jak interpretuje to wykład?',o:[&quot;Sam wynik bez objawów nie spełnia kryteriów rozpoznania choroby&quot;, &quot;Wynik wystarcza do rozpoznania objawowego CDI&quot;, &quot;Dodatni wynik zawsze świadczy o toksycznym rozdęciu okrężnicy&quot;, &quot;Dodatni wynik jest równoznaczny z ciężkim CDI niezależnie od objawów&quot;],a:0,e:'Na slajdzie wyraźnie zaznaczono, że wykrycie bakterii lub toksyn bez objawów nie spełnia kryteriów rozpoznania choroby. Trzeba odróżnić nosicielstwo od objawowego zakażenia.'},
    {t:'Yersinia',s:2385,q:'Jaką ekspozycję pokarmową powiązano z Yersinia enterocolitica?',o:[&quot;Spożycie niedogotowanej wieprzowiny&quot;, &quot;Spożycie jaj skażonych przed wytworzeniem skorupki&quot;, &quot;Spożycie kremu z gotową toksyną gronkowcową&quot;, &quot;Wyłącznie kontakt z ludzkim nosicielem&quot;],a:0,e:'Przy Y. enterocolitica wskazano niedogotowaną wieprzowinę. Wymieniono również zanieczyszczoną wodę jako źródło zakażenia.'},
    {t:'Yersinia',s:2405,q:'Który obraz kliniczny może być wywołany przez enteropatogenną Yersinia?',o:[&quot;Rzekome zapalenie wyrostka i zapalenie węzłów chłonnych krezki&quot;, &quot;Typowa różyczka durowa z przedłużoną bakteriemią&quot;, &quot;Stolce ryżowate z utratą płynów rzędu litra na godzinę&quot;, &quot;Wyłącznie nagłe wymioty po 1–6 godzinach od posiłku&quot;],a:0,e:'Wykład wymienia rzekome zapalenie wyrostka, zapalenie węzłów chłonnych krezki i końcowego odcinka jelita cienkiego, a także zespoły immunoreaktywne.'},
    {t:'Campylobacter',s:2485,q:'Która droga zakażenia Campylobacter jejuni jest zgodna z wykładem?',o:[&quot;Żywność pochodzenia zwierzęcego, zanieczyszczona woda lub bezpośredni kontakt ze zwierzętami&quot;, &quot;Wyłącznie człowiek, bez udziału rezerwuaru zwierzęcego&quot;, &quot;Wyłącznie wdychanie aerozolu od chorego&quot;, &quot;Wyłącznie spożycie gotowej enterotoksyny bez zakażenia bakterią&quot;],a:0,e:'Campylobacter występuje w przewodach pokarmowych wielu zwierząt. Zakażenie jest możliwe przez żywność, wodę i kontakt ze zwierzętami; wykład wymienia też transmisję fekalno-oralną między ludźmi.'},
    {t:'Zakażenia wirusowe',s:2565,q:'Jaki efekt powszechnych szczepień przeciw rotawirusom opisano w wykładzie?',o:[&quot;Znaczny spadek chorobowości w krajach, które je wprowadziły&quot;, &quot;Brak wpływu na częstość choroby u dzieci poniżej 5 lat&quot;, &quot;Eliminację wszystkich przyczyn biegunki u dzieci&quot;, &quot;Ochronę przed norowirusami bez wpływu na rotawirusy&quot;],a:0,e:'Rotawirusy przedstawiono jako ważną przyczynę ciężkiego zapalenia żołądka i jelit u dzieci poniżej 5 lat. Wprowadzenie powszechnych szczepień wiązało się ze znacznym spadkiem chorobowości.'},
    {t:'Zakażenia wirusowe',s:2605,q:'Dlaczego po przebyciu zakażenia norowirusem możliwa jest reinfekcja?',o:[&quot;Odporność pochorobowa utrzymuje się przez ograniczony czas&quot;, &quot;Zakażenie zapewnia zawsze trwałą odporność&quot;, &quot;Zakażenie chroni przed reinfekcją aż do wieku podeszłego&quot;, &quot;Odporność pochorobowa jest zawsze szersza i trwalsza niż po innych zakażeniach jelitowych&quot;],a:0,e:'Wykład zaznacza ograniczony czas utrzymywania się odporności i możliwość reinfekcji. Norowirusy mogą powodować zachorowania zbiorowe m.in. w szpitalach, szkołach i na wycieczkowcach.'}
